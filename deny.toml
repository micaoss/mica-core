# cargo-deny 0.19.x configuration for the micad workspace.

[licenses]
# All workspace crates are publish = false; skip license checks for them.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# The workspace's crypto backend is aws-lc-rs; OpenSSL and native-tls are refused.
deny = [
    { crate = "openssl", reason = "TLS is rustls on aws-lc-rs" },
    { crate = "openssl-sys", reason = "TLS is rustls on aws-lc-rs" },
    { crate = "native-tls", reason = "TLS is rustls on aws-lc-rs" },
]

[advisories]
# Vulnerabilities are errors by default in the version-2 schema;
# unmaintained advisories only warn.
unmaintained = "all"
ignore = []
