[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
# Every warn-by-default lint, now and in future toolchains, is an error: the policy
# lives here, so local builds and the gate see the same rules.
warnings = { level = "deny", priority = -2 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A runtime path never panics: unwrap, expect and panic are for tests (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
# The one `com.mica.*` bus-name rule, shared by every consumer of it.
mica-busname = { path = "crates/mica-busname" }
mica-fs = { path = "crates/mica-fs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tracing = "0.1"
# env-filter, so RUST_LOG still works. It pulls in regex (~1 MB in the
# binary), and that is the right trade on a device with no shell and no
# package manager: the journal is the only way to see what micad did, and a
# fixed compile-time level means a field problem cannot be looked at more
# closely without a new image.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
# The one crypto library: digests, HMAC, randomness, Ed25519 and rustls's provider.
aws-lc-rs = "1"
# WireGuard key handling. base64 is the wire and file format of every key
# (`PrivateKeyFile=` and `PublicKey=`); 0.22 is a version the dependency graph
# already resolves, so the direct dependency adds no crate to the image.
base64 = "0.22"
url = "2"
axum = "0.8"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
# The OpenAPI document is generated from the handlers and committed as
# `crates/mica-apid/openapi.json`, so the spec cannot describe a route the code does
# not serve. Each route's path is one constant, read by the axum declaration
# and by the `utoipa::path` attribute that documents it.
#
# `axum_extras` is deliberately off: it teaches the `path` macro to read axum's
# `Path`/`Query` extractors, and no documented route takes a path or query
# parameter.
#
# `utoipa-axum` is deliberately absent. It would collect the routes straight
# out of the router, but it depends on `paste`, which carries an unmaintained
# advisory (RUSTSEC-2024-0436) that `deny.toml` makes an error. `context_path`
# composes the same document without it.
utoipa = "5.5"
rustls = { version = "0.23.44", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
# Reading an uploaded certificate for the console: the version rcgen already
# resolves, so the direct dependency adds no crate.
x509-parser = { version = "0.18", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
bcrypt = "0.19"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "cookies"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustix = { version = "1", features = ["fs"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# rumqttc without default features is TCP-only: no TLS, and every remaining
# dependency is pure Rust. The `use-rustls` default would pull tokio-rustls in;
# TLS to the broker is a later decision.
rumqttc = { version = "0.25", default-features = false }
# The broker, used as a library rather than as its own daemon. Defaults off
# buys three things: TCP only, so no `use-rustls` and therefore no rustls 0.22
# with its live advisory; no websockets; and every remaining dependency pure
# Rust. That last one is the reason this is here at all instead of Debian's
# mosquitto, which would drag libcjson1, libmosquitto1, libdlt2 and
# libwebsockets19t64 into a root filesystem that has no package manager to
# maintain them.
rumqttd = { version = "0.20", default-features = false }
# The SFTP v3 wire format for mica-sftp-server, the `/usr/lib/sftp-server`
# dropbear execs for the sftp subsystem. Pure Rust; `bytes` is the buffer type
# its packets decode from and encode to.
russh-sftp = "3.0.0"
bytes = "1"

# Every shipped executable is stripped: nothing on a device reads a symbol
# table. A backtrace from a device is resolved against an unstripped build of
# the same commit, which is reproducible. Whole-program LTO in one codegen unit
# removes what no executable reaches across crates: about a sixth of micad and
# a quarter of mica-mqttd, at the cost of a longer release build. Panics stay
# unwinding: apid turns a panicking blocking task into a state.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
# Size over speed: a quarter to two fifths off every executable (micad 17.4 -> 11.6 MB). The
# hot path, hashing an update's objects, is aws-lc's assembly, which this does not touch.
opt-level = "s"
