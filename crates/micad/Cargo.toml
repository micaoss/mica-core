[package]
name = "micad"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The executable keeps its name; the package is named for the workspace.
[[bin]]
name = "micad"
path = "src/main.rs"

[dependencies]
micad-settings = { path = "../micad-settings" }
mica-fs = { workspace = true }
# Project quota usage by quotactl_fd(2), in place of spawning repquota.
lifecycle-sys = { path = "../lifecycle-sys" }
# The API daemon, which this executable runs when it is started as `mica-apid`.
mica-apid = { path = "../mica-apid" }
# An app's update check downloads like the deployment client, and compares
# versions in dpkg's order like it.
mica-deploy = { path = "../mica-deploy" }
url = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# The one `com.mica.*` bus-name rule: the service registry takes
# it rather than restating it.
mica-busname = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
# The settings store and the offline provisioning document are both TOML; the
# crate is already in the workspace graph via micad-settings. The update policy
# document is not among them: it is /mica/config/updates.json, which is JSON.
toml = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bcrypt = { workspace = true }
aws-lc-rs = { workspace = true }
# SPAKE2+ point arithmetic; every other primitive is aws-lc-rs.
p256 = { workspace = true }
hex = { workspace = true }
# The WireGuard keystore: base64 is the key format on disk and on the wire;
# aws-lc-rs derives the public half of a private key without a `wg` binary.
base64 = { workspace = true }
# `process` for the `networkctl delete` teardown the network reconciler runs when a
# virtual device's unit goes away; networkd does not reap devices it created.
tokio = { workspace = true, features = ["process", "signal", "time", "io-util"] }
rustix = { workspace = true, features = ["net", "process", "system", "termios", "time"] }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mdns-sd = { workspace = true }
# The interface type mdns-sd's interface predicate takes; already in its graph.
if-addrs = "0.15"

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
