<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- com.mica.micad is root-only in both directions. The interface reboots,
       rewrites settings and writes a root credential, and its SettingsChanged
       signal carries setting values, so a uid that may not call it must not
       receive its signals either. The explicit denies in the default context
       close the signal side, which system.conf would otherwise leave open.
       A future non-root client gets its own <policy user="..."> block; never
       reopen the default context. mica-mqttd has no access. -->

  <policy context="default">
    <deny send_destination="com.mica.micad"/>
    <deny receive_sender="com.mica.micad"/>
  </policy>

  <policy user="root">
    <allow own="com.mica.micad"/>
    <allow send_destination="com.mica.micad"/>
    <allow receive_sender="com.mica.micad"/>
  </policy>
</busconfig>
