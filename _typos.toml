# typos: what reads as a misspelling here and is not.

[default]
extend-ignore-re = [
    # Hex digests, ids and hashes.
    "\\b[0-9a-f]{8,}\\b",
]

[default.extend-words]
# A published outcome code (`client-output-unparseable`) and the prose around it.
unparseable = "unparseable"
# "mis-targets", "mis-clicked".
mis = "mis"
# `café` split at the escape in a test string.
caf = "caf"
# Deliberate misspellings: test inputs a validator must refuse.
netwrok = "netwrok"
acess = "acess"
alwys = "alwys"
hiden = "hiden"
abd = "abd"
# Bosnia and Herzegovina's ISO 3166 code, in the regulatory country list.
BA = "BA"
# setpriv's `--inh-caps`, the inheritable capabilities.
inh = "inh"

[default.extend-identifiers]
# O_WRONLY.
WRONLY = "WRONLY"
# The DesignWare watchdog's vendor.
Synopsys = "Synopsys"
# rtnetlink's output interface attribute.
RTA_OIF = "RTA_OIF"
